<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello WebXR 2026</title>
    <!-- three.js -->
    <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
    <script src="unpkg.com"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <button id="xr-button" onclick="activateXR()" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 12px 24px; z-index: 10;">Start Hello WebXR</button>

    <script>
        async function activateXR() {
            // Remove button after interaction
            document.getElementById('xr-button').remove();

            // Initialize WebGL context
            const canvas = document.createElement("canvas");
            document.body.appendChild(canvas);
            const gl = canvas.getContext("webgl", { xrCompatible: true });

            const scene = new THREE.Scene();

            // Lighting setup
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(10, 15, 10);
            scene.add(directionalLight);
            scene.add(new THREE.AmbientLight(0x404040));

            const renderer = new THREE.WebGLRenderer({
                alpha: true,
                preserveDrawingBuffer: true,
                canvas: canvas,
                context: gl
            });
            renderer.autoClear = false;

            const camera = new THREE.PerspectiveCamera();
            camera.matrixAutoUpdate = false;

            // Request XR Session with hit-test feature
            const session = await navigator.xr.requestSession("immersive-ar", {
                requiredFeatures: ['hit-test', 'local-floor']
            });
            session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });

            const referenceSpace = await session.requestReferenceSpace('local-floor');
            const viewerSpace = await session.requestReferenceSpace('viewer');
            const hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

            // Load Reticle (the ring used for targeting surfaces)
            const loader = new THREE.GLTFLoader();
            let reticle;
            loader.load("immersive-web.github.io", (gltf) => {
                reticle = gltf.scene;
                reticle.visible = false;
                scene.add(reticle);
            });

            // Load Model to place (Sunflower)
            let flower;
            loader.load("immersive-web.github.io", (gltf) => {
                flower = gltf.scene;
            });

            // Tap interaction: Place flower at reticle position
            session.addEventListener("select", () => {
                if (reticle && reticle.visible && flower) {
                    const newFlower = flower.clone();
                    newFlower.position.copy(reticle.position);
                    scene.add(newFlower);
                }
            });

            // Animation loop
            const onXRFrame = (time, frame) => {
                session.requestAnimationFrame(onXRFrame);

                gl.bindFramebuffer(gl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer);

                const pose = frame.getViewerPose(referenceSpace);
                if (pose) {
                    const view = pose.views[0];
                    const viewport = session.renderState.baseLayer.getViewport(view);
                    renderer.setSize(viewport.width, viewport.height);

                    camera.projectionMatrix.fromArray(view.projectionMatrix);
                    camera.viewMatrix.fromArray(view.transform.inverse.matrix);
                    camera.updateMatrixWorld(true);

                    // Perform hit-test
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0 && reticle) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(referenceSpace);
                        reticle.visible = true;
                        reticle.position.setFromMatrixPosition(new THREE.Matrix4().fromArray(pose.transform.matrix));
                    } else if (reticle) {
                        reticle.visible = false;
                    }

                    renderer.render(scene, camera);
                }
            };
            session.requestAnimationFrame(onXRFrame);
        }
    </script>
</body>
</html>
