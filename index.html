<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>WebXR Modele Patrzą na Ciebie</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        #ui-container {
            position: absolute; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 300px;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 20px;
            z-index: 100;
            display: none;
        }

        button.nav-btn {
            background: #333; color: white; border: none;
            width: 40px; height: 40px; border-radius: 50%;
            font-size: 20px; cursor: pointer;
        }

        #model-name {
            font-weight: bold; color: #333; text-align: center;
            flex-grow: 1; margin: 0 10px;
        }

        #info {
            position: absolute; top: 10px; width: 100%; text-align: center;
            color: white; text-shadow: 1px 1px 2px black; pointer-events: none;
            z-index: 10;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">Modele będą obrócone twarzą do Ciebie.</div>

    <div id="ui-container">
        <button class="nav-btn" id="btn-prev">&lt;</button>
        <span id="model-name">Ładowanie...</span>
        <button class="nav-btn" id="btn-next">&gt;</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Lista modeli
        const MODELS = [
            "https://immersive-web.github.io/MyWebXRTest/love.obj",
            "https://immersive-web.github.io/webxr-samples/media/gltf/space-shuttle.gltf",
            "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/SheenChair/glTF/SheenChair.gltf" 
        ];

        let currentModelIndex = 0;
        let loadedTemplates = {};
        let currentTemplate = null;

        let camera, scene, renderer;
        let controller, reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        const uiContainer = document.getElementById('ui-container');
        const nameLabel = document.getElementById('model-name');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = null;

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(0, 10, 0);
            scene.add(dirLight);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0); 
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            const arButton = ARButton.createButton(renderer, { 
                requiredFeatures: ['hit-test'],
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.body } 
            });
            arButton.addEventListener('click', () => {
                uiContainer.style.display = 'flex';
            });
            document.body.appendChild(arButton);

            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            btnPrev.addEventListener('click', (e) => { e.stopPropagation(); changeModel(-1); });
            btnNext.addEventListener('click', (e) => { e.stopPropagation(); changeModel(1); });

            loadModel(0);
            window.addEventListener('resize', onWindowResize);
        }

        function getFileName(url) {
            const parts = url.split('/');
            return parts[parts.length - 1].split('.')[0].toUpperCase();
        }

        function changeModel(direction) {
            currentModelIndex += direction;
            if (currentModelIndex < 0) currentModelIndex = MODELS.length - 1;
            if (currentModelIndex >= MODELS.length) currentModelIndex = 0;
            loadModel(currentModelIndex);
        }

        function loadModel(index) {
            const url = MODELS[index];
            const name = getFileName(url);
            nameLabel.innerText = "Ładowanie...";

            if (loadedTemplates[url]) {
                currentTemplate = loadedTemplates[url];
                nameLabel.innerText = name;
                return;
            }

            const loader = new GLTFLoader();
            loader.load(url, (gltf) => {
                let model = gltf.scene;
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3()).length();
                const scaleFactor = 0.5 / size;
                model.scale.setScalar(scaleFactor);

                loadedTemplates[url] = model;
                currentTemplate = model;
                nameLabel.innerText = name;
            });
        }

        // --- GŁÓWNA ZMIANA TUTAJ ---
        function onSelect() {
            if (reticle.visible && currentTemplate) {
                const newObject = currentTemplate.clone();
                
                // 1. Pobierz pozycję z celownika
                reticle.matrix.decompose(newObject.position, newObject.quaternion, newObject.scale);
                
                // 2. Oblicz punkt, na który obiekt ma patrzeć.
                // Używamy pozycji kamery (X i Z), ale zachowujemy wysokość obiektu (Y).
                // Dzięki temu obiekt obraca się tylko "na boki", a nie pochyla do góry/w dół.
                const lookAtPos = new THREE.Vector3(
                    camera.position.x,
                    newObject.position.y,
                    camera.position.z
                );

                // 3. Wykonaj obrót
                newObject.lookAt(lookAtPos);
                
                scene.add(newObject);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (!hitTestSourceRequested) {
                    session.requestReferenceSpace('viewer').then((refSpace) => {
                        session.requestHitTestSource({ space: refSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', () => { 
                        hitTestSourceRequested = false; 
                        hitTestSource = null; 
                        uiContainer.style.display = 'none';
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
