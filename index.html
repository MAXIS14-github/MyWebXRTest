<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>WebXR DIAGNOSTYKA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; font-family: monospace; }
        
        /* Konsola błędów na ekranie */
        #debug-console {
            position: absolute; top: 0; left: 0; width: 100%; height: 200px;
            background: rgba(255, 255, 0, 0.9); /* Żółte tło */
            color: black;
            padding: 10px;
            overflow-y: scroll;
            z-index: 99999;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="debug-console">Inicjalizacja...<br></div>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        const debugBox = document.getElementById('debug-console');
        
        // Funkcja logująca na ekran
        function log(msg) {
            console.log(msg);
            debugBox.innerHTML += `> ${msg}<br>`;
            debugBox.scrollTop = debugBox.scrollHeight;
        }

        function error(msg) {
            console.error(msg);
            debugBox.innerHTML += `<b style="color:red">BŁĄD: ${msg}</b><br>`;
        }

        try {
            log("Sprawdzanie wsparcia XR...");
            
            if (!navigator.xr) {
                error("Twoja przeglądarka nie wspiera WebXR! (Użyj Chrome na Androidzie)");
            } else {
                navigator.xr.isSessionSupported('immersive-ar')
                    .then((supported) => {
                        if (supported) {
                            log("Sukces: immersive-ar jest wspierane!");
                        } else {
                            error("Urządzenie nie wspiera AR (immersive-ar). Sprawdź Google Play Services for AR.");
                        }
                    })
                    .catch((err) => error("Błąd sprawdzania wsparcia: " + err));
            }

            const container = document.createElement('div');
            document.body.appendChild(container);

            const scene = new THREE.Scene();
            
            // 1. Tło musi być null
            scene.background = null; 
            log("Scena utworzona");

            const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            // 2. Wymuszenie przezroczystości
            renderer.setClearColor(0x000000, 0); 
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);
            log("Renderer gotowy");

            // Dodaj testową kostkę
            const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            const material = new THREE.MeshNormalMaterial();
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(0, 0, -0.5);
            scene.add(cube);
            log("Dodano kostkę testową");

            const button = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] });
            document.body.appendChild(button);
            log("Przycisk AR utworzony. Kliknij go.");

            renderer.setAnimationLoop((timestamp, frame) => {
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
                renderer.render(scene, camera);
            });

        } catch (e) {
            error("Krytyczny błąd skryptu: " + e.message);
        }
    </script>
</body>
</html>
