<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>WebXR Fix Black Screen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #info {
            position: absolute; top: 20px; width: 100%;
            text-align: center; color: white; font-family: sans-serif;
            background: rgba(0,0,0,0.5); padding: 10px; z-index: 10;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">
        1. Jeśli widzisz to na telefonie - jest OK.<br>
        2. Kliknij "START AR".<br>
        3. Powinieneś zobaczyć kamerę i lewitującą kostkę.
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let camera, scene, renderer;
        let controller;
        let reticle;
        let flowerModel;
        let debugCube; // Dodatkowa kostka do testu

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            // KLUCZOWA POPRAWKA: Upewnij się, że tło sceny jest puste (null), 
            // aby kamera mogła prześwitywać.
            scene.background = null; 

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // Światło
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            // Renderer z przezroczystością (alpha: true)
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // KLUCZOWA POPRAWKA: Wymuś czyszczenie koloru na przezroczysty
            renderer.setClearColor(0x000000, 0); 
            
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // Przycisk AR
            // 'domOverlay' pozwala widzieć elementy HTML (np. napisy) na wierzchu kamery
            const button = ARButton.createButton(renderer, { 
                requiredFeatures: ['hit-test'],
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.body } 
            });
            document.body.appendChild(button);

            // --- DODATEK DIAGNOSTYCZNY: Czerwona kostka ---
            // Unosi się 1 metr przed Tobą. Jeśli ją widzisz, Three.js działa.
            const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            debugCube = new THREE.Mesh(geometry, material);
            debugCube.position.set(0, 0, -0.5); // 50cm przed kamerą
            scene.add(debugCube);
            // ----------------------------------------------

            // Celownik (Reticle)
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // Ładowanie modelu
            const loader = new GLTFLoader();
            loader.load("https://immersive-web.github.io/webxr-samples/media/gltf/sunflower/sunflower.gltf", 
                (gltf) => { flowerModel = gltf.scene; },
                undefined,
                (error) => { console.error("Błąd ładowania modelu:", error); }
            );

            // Obsługa dotyku
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            window.addEventListener('resize', onWindowResize);
        }

        function onSelect() {
            if (reticle.visible && flowerModel) {
                const newFlower = flowerModel.clone();
                reticle.matrix.decompose(newFlower.position, newFlower.quaternion, newFlower.scale);
                newFlower.rotation.y = Math.random() * Math.PI * 2;
                scene.add(newFlower);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            // Obracanie kostki diagnostycznej (żebyś wiedział, że aplikacja nie zamarzła)
            if(debugCube) {
                debugCube.rotation.x += 0.01;
                debugCube.rotation.y += 0.01;
            }

            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                // Logika hit-test
                if (!window.hitTestSourceRequested) {
                    session.requestReferenceSpace('viewer').then((refSpace) => {
                        session.requestHitTestSource({ space: refSpace }).then((source) => {
                            window.hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', () => { 
                        window.hitTestSourceRequested = false; 
                        window.hitTestSource = null; 
                    });
                    window.hitTestSourceRequested = true;
                }

                if (window.hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(window.hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
